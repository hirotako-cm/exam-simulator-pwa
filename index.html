<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0284c7">
<title>模擬試験シミュレーター</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-row">
    <h1 id="header-title">模擬試験シミュレーター</h1>
    <div class="header-timer" id="header-timer"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</header>

<div id="storage-banner" class="banner banner-warning hidden">
  <span id="storage-banner-text"></span>
</div>

<main id="app-main">

  <!-- ============ HOME ============ -->
  <section id="screen-home">
    <div class="card hidden" id="resume-banner">
      <h2>中断した試験があります</h2>
      <p id="resume-text"></p>
      <div class="btn-row">
        <button class="btn btn-primary" id="resume-continue-btn">再開する</button>
        <button class="btn btn-danger" id="resume-discard-btn">破棄する</button>
      </div>
    </div>

    <div class="card">
      <h2>問題セット</h2>
      <div id="set-list"><p class="hint">まだ問題セットがありません。下の「インポート」から読み込んでください。</p></div>
    </div>

    <div class="card">
      <h2>問題セットをインポート</h2>
      <div class="setup-group import-section">
        <label for="import-file-input">ファイルから読み込む（.json）</label>
        <input type="file" id="import-file-input" accept="application/json,.json">
      </div>
      <div class="setup-group import-section">
        <label for="import-paste-textarea">JSONを貼り付けて読み込む</label>
        <textarea id="import-paste-textarea" placeholder='{"schemaVersion":2,"set":{"id":"...","name":"..."},"questions":[...]}'></textarea>
        <div class="btn-row tight">
          <button class="btn btn-primary" id="import-paste-btn">貼り付けた内容をインポート</button>
        </div>
      </div>
      <div id="import-errors" class="hidden"></div>
    </div>
  </section>

  <!-- ============ SETUP ============ -->
  <section id="screen-setup" class="hidden">
    <div class="card">
      <h2 id="setup-set-name">セット</h2>
      <div class="setup-group">
        <label>出題数</label>
        <div class="seg" id="setup-count-seg"></div>
        <div style="margin-top:0.5rem">
          <input type="number" id="setup-count-input" min="1" step="1"> 問（任意入力可）
        </div>
        <div class="hint" id="setup-count-hint"></div>
      </div>
      <div class="setup-group">
        <label>制限時間</label>
        <input type="number" id="setup-time-input" min="1" step="1"> 分
        <div class="hint" id="setup-time-hint"></div>
      </div>
      <div class="setup-group">
        <label>出題言語</label>
        <div class="seg" id="setup-lang-seg">
          <button data-lang="en">英語</button>
          <button data-lang="ja">日本語</button>
          <button data-lang="both">英日併記</button>
        </div>
      </div>
      <div class="setup-group">
        <label class="checkbox-label"><input type="checkbox" id="setup-shuffle-checkbox"> 出題順をシャッフルする</label>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary btn-lg" id="setup-start-btn">スタート</button>
        <button class="btn" id="setup-back-btn">← セット選択に戻る</button>
      </div>
    </div>
  </section>

  <!-- ============ QUESTION ============ -->
  <section id="screen-question" class="hidden">
    <div class="card">
      <div class="q-meta">
        <span class="q-number" id="q-number"></span>
        <span class="q-select-hint hidden" id="q-select-hint"></span>
      </div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
      <div class="action-row">
        <button class="btn flag-btn" id="flag-btn">🚩 あとで見直す</button>
        <button class="btn lang-btn" id="lang-btn">🌐 日本語で表示</button>
        <button class="btn memo-btn" id="memo-btn">📝 メモ</button>
      </div>
      <div class="palette" id="palette"></div>
    </div>
    <div class="bottom-nav">
      <button class="btn" id="prev-btn">← 前へ</button>
      <button class="btn" id="to-list-btn">解答一覧へ</button>
      <button class="btn btn-primary" id="next-btn">次へ →</button>
    </div>
  </section>

  <!-- ============ ANSWER LIST (pre-submit) ============ -->
  <section id="screen-list" class="hidden">
    <div class="card">
      <h2>解答一覧</h2>
      <div class="seg" id="list-filter-seg">
        <button data-filter="all" class="active">すべて</button>
        <button data-filter="flagged">🚩 見直しのみ</button>
        <button data-filter="unanswered">未解答のみ</button>
      </div>
      <div id="list-rows" style="margin-top:0.8rem"></div>
    </div>
    <div class="bottom-nav">
      <button class="btn" id="list-back-btn">← 問題に戻る</button>
      <button class="btn btn-primary" id="list-submit-btn">提出して採点する</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="hidden">
    <div class="card result-hero">
      <div class="big" id="result-score"></div>
      <div class="sub" id="result-sub"></div>
    </div>
    <div class="card">
      <h2>問題別レビュー（タップで復習）</h2>
      <div id="result-rows"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="result-review-wrong-btn">間違えた問題を順に復習</button>
        <button class="btn" id="result-export-btn">結果をJSONエクスポート</button>
        <button class="btn" id="result-home-btn">トップに戻る</button>
      </div>
    </div>
  </section>

  <!-- ============ REVIEW (post-submit) ============ -->
  <section id="screen-review" class="hidden">
    <div class="card">
      <div class="q-meta">
        <span class="q-number" id="rev-number"></span>
        <span class="rev-time" id="rev-time"></span>
      </div>
      <div class="area-tag" id="rev-area"></div>
      <div class="question-text" id="rev-text"></div>
      <div class="options" id="rev-options"></div>
      <div id="rev-feedback"></div>
      <div class="action-row">
        <button class="btn memo-btn" id="rev-memo-btn">📝 メモ</button>
        <button class="btn" id="rev-copy-btn">📋 解説用にコピー</button>
        <button class="btn" id="rev-lang-btn">🌐 日本語で表示</button>
      </div>
    </div>
    <div class="bottom-nav">
      <button class="btn" id="rev-prev-btn">← 前へ</button>
      <button class="btn" id="rev-back-btn">結果に戻る</button>
      <button class="btn btn-primary" id="rev-next-btn">次へ →</button>
    </div>
  </section>

</main>

<footer>解答・成績は端末内（IndexedDB / localStorage）に保存されます。問題文は外部に送信されません。</footer>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
